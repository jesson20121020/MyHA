# mqtt/istoreos_sensors.yaml
# mem
- name: iStoreOS RAM used
  state_topic: collectd/iStoreOS/memory/memory-used
  unit_of_measurement: "%"
  value_template: "{{ '%.2f' | format(value.split(':')[1].split('\x00')[0] | float / (16 * 1024 * 10000))}}"
  unique_id: ram_used
  device:
    identifiers: IStoreOS
    name: 倍控J4125
    model: J4125
    manufacturer: 倍控

