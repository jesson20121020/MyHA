card_esh_common_light:
  tap_action:
    action: "more-info"
  template:
    - "card_esh_common"
  variables:
    name: "[[[ return entity.attributes.friendly_name ]]]"
    state: >
        [[[
          return entity.state === 'on' ? '已开' : '已关';
        ]]]
    entity_1:
      label: "亮度"
      state: >
        [[[
        const brightness = entity.attributes.brightness;
        if (brightness){
            return Math.round(brightness * 100 / 255) + "%";
        }
        else
        {
            return "0%"
        }
        ]]]
    entity_2:
      label: "色温"
      state: >
        [[[
          if (entity.attributes.color_temp_kelvin) {
            return entity.attributes.color_temp_kelvin + "K";
          } else {
            return "0K";
          }
        ]]]