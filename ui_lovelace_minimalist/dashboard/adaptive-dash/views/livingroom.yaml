---
type: "custom:layout-card"
layout_type: "custom:grid-layout"
layout:
  grid-template-rows: "min-content"
  grid-template-columns: "1fr 1fr 1fr"
  grid-template-areas: >
    "title1 title1 title1"
    "card1 card1 card1"
    "card2 card3 card4"
    "card5 card6 ."
    "card7 card8 card9"
    "card10 card11 card12"
    "card13 card14 card15"
    "card16 card17 card18"
  mediaquery:
    # Mobile
    "(max-width: 800px)":
      grid-template-columns: "1fr 1fr"
      grid-template-areas: |
        "title1 title1"
        "card1 card1"
        "card2 card3"
        "card4 card5"
        "card6 card7"
        "card8 card9"
        "card10 card11"
        "card12 card13"
        "card14 card15"
        "card16 card17"
        "card18 card19"
view_layout:
  grid-area: "livingroom"
cards:
  - view_layout:
      grid-area: "title1"
    type: horizontal-stack

    cards:
      # 显示房间当前开灯总数量
      - type: "custom:button-card"
        template: chip_common_icon_state
        variables:
          ulm_chip_mdi_icon_state_entity: sensor.kai_deng_zong_shu_liang
          ulm_chip_mdi_icon_state_icon: mdi:lightbulb-group
        styles:
          card:
            - margin: none
            - display: >
                [[[
                  return states['sensor.kai_deng_zong_shu_liang'].state > 0 ? 'block' : 'none';
                ]]]
    
      # 空调，加热器数量
      - type: "custom:button-card"
        template: chip_common_icon_state
        variables:
          ulm_chip_mdi_icon_state_entity: sensor.kong_diao_jia_re_qi_kai_qi_shu_liang
          ulm_chip_mdi_icon_state_icon: mdi:air-conditioner
        styles:
          card:
            - margin: none
            - display: >
                [[[
                  return states['sensor.kong_diao_jia_re_qi_kai_qi_shu_liang'].state > 0 ? 'block' : 'none';
                ]]]
    
      # 媒体播放器数量
      - type: "custom:button-card"
        template: chip_common_icon_state
        variables:
          ulm_chip_mdi_icon_state_entity: sensor.yin_xiang_dian_shi_zheng_zai_bo_fang_shu_liang
          ulm_chip_mdi_icon_state_icon: mdi:television-speaker
    
      # 洗衣机，烘干机正在工作数量
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.xi_yi_ji_hong_gan_ji_gong_zuo_shu_liang
            above: -1
        card:
          type: "custom:button-card"
          template: chip_common_icon_state
          variables:
            ulm_chip_mdi_icon_state_entity: sensor.xi_yi_ji_hong_gan_ji_gong_zuo_shu_liang
            ulm_chip_mdi_icon_state_icon: mdi:washing-machine
      # 各种设备门处于打开状态下的数量
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.she_bei_men_da_kai_shu_liang
            above: -1
        card:
          type: "custom:button-card"
          template: chip_common_icon_state
          variables:
            ulm_chip_mdi_icon_state_entity: sensor.she_bei_men_da_kai_shu_liang
            ulm_chip_mdi_icon_state_icon: mdi:door-open

  - view_layout:
      grid-area: "title2"
    type: "custom:button-card"
    template: "card_title"
    name: "Some title"
    label: "grid-area: title2"

  - view_layout:
      grid-area: "card1"
    type: "custom:button-card"
    template: "card_title"
    name: "Put here your <br> first card"
    label: "grid-area: card1"

  - view_layout:
      grid-area: "card2"
    type: "custom:button-card"
    template: "card_title"
    name: "Put here your <br> second card"
    label: "grid-area: card2"

  - view_layout:
      grid-area: "card3"
    type: "custom:button-card"
    template: "card_title"
    name: "Put here your <br> third card"
    label: "grid-area: card3"

  - view_layout:
      grid-area: "card4"
    type: "custom:button-card"
    template: "card_title"
    name: "Put here your <br> fourth card"
    label: "grid-area: card4"

  - view_layout:
      grid-area: "card5"
    type: "custom:button-card"
    template: "card_title"
    name: "Put here your <br> fifth card"
    label: "grid-area: card5"

  - view_layout:
      grid-area: "card6"
    type: "custom:button-card"
    template: "card_title"
    name: "Put here your <br> sixth card"
    label: "grid-area: card6"
