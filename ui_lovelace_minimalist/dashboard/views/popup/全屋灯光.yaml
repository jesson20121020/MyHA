type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#light"
    show_header: false
    bg_color: rgb(255.255.255)
    bg_blur: "0"
    bg_opacity: "80"
    button_type: name
    card_layout: large
    backdrop_blur: "0"
    hide_backdrop: false
    width_desktop: 80%
    shadow_opacity: "0"
    margin: 7px
    margin_top_mobile: 0px
    margin_top_desktop: "-15vh"
    styles: |-
      .bubble-pop-up {
          height: 80vh !important;
      }  
  - type: custom:bubble-card
    card_type: empty-column
    card_layout: normal
  - type: custom:button-card
    name: 全屋灯光
    icon: []
    entity: light.quan_wu_deng_zu
    show_state: false
    state:
      - value: "on"
        styles:
          name:
            - color: black
    styles:
      grid:
        - grid-template-areas: "\"i n switch\""
        - grid-template-columns: 60px 1fr 50px;
      card:
        - border-radius: 25px
        - padding: 12px 14px 12px 8px
        - border: none;
        - background: |
            [[[
              if (entity.state == "off") {
                return "rgba(255, 255, 255, 0.1)"; 
              }else {
                return "rgba(255, 255, 255, 1)";
              }
            ]]]
        - transition: background 0.5s ease
        - backdrop-filter: |
            [[[ return entity.state == "off" ? 'blur(10px)' : 'none'; ]]]     
      img_cell:
        - background: "#EEE8CD"
        - border-radius: 200px
        - width: 50px
        - height: 50px
      icon:
        - width: 33px
        - background-image: url('/local/icon/灯光.png')
        - background-size: contain
        - background-repeat: no-repeat
        - background-position: center center
      name:
        - justify-self: start
        - font-size: 20px
        - font-weight: bold
        - color: null
        - padding-left: 9px
      state:
        - justify-self: start
        - font-size: 20px
        - color: var(--secondary-text-color)
        - opacity: "1"
        - padding-left: 0px
    custom_fields:
      switch:
        card:
          type: custom:button-card
          icon: mdi:power
          entity: light.quan_wu_deng_zu
          show_name: false
          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
            icon:
              - width: 28px
          state:
            - value: "on"
              styles:
                icon:
                  - color: "#FF8C00"
            - value: "off"
              styles:
                icon:
                  - color: black
          tap_action:
            action: toggle
  - type: custom:bubble-card
    card_type: empty-column
    card_layout: normal
  - type: custom:bubble-card
    card_type: separator
    name: 书房丨Light
    icon: phu:rooms-hallway
    sub_button:
      - entity: light.dikair_cn_392944107_wy0a01_s_2_2
        icon: mdi:power
        tap_action:
          action: toggle
        show_background: true
        light_background: true
        show_state: false
        show_last_changed: false
        show_attribute: false
        state_background: false
    styles: |
      .bubble-sub-button-1 {
        background-color: ${hass.states['light.dikair_cn_392944107_wy0a01_s_2_2'].state === 'on' ? '#FF8C00' : 'white'} !important;
      }
      .bubble-line {
          margin-right: 14px;
          # 背景透明度（0-100）
          opacity: 0.1;
          height: 4px;      
          background-color: gray;
      }      
  - type: grid
    columns: 2
    square: false
    cards:
      - type: "custom:button-card"
        template: card_state_light
        entity: light.dikair_cn_392944107_wy0a01_s_2_2
        variables:
          ulm_card_light_name: "书房灯"
          ulm_custom_popup:
            entity: light.dikair_cn_392944107_wy0a01_s_2_2

