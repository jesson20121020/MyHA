                        - margin-left: "-10px"
                        - margin-top: "-3px"
                        - padding: 5px
                        - border-radius: 5px
                        - box-shadow: none
                        - background: rgba(0,0,0,0)
                        - border: none
                      grid:
                        - grid-template-areas: |
                            "type connect" 
                        - grid-template-columns: 50px 240px
                    custom_fields:
                      type:
                        card:
                          type: custom:button-card
                          name: 连接
                          styles:
                            card:
                              - height: 21px
                              - width: 100px
                              - padding: 5px
                              - border-radius: 5px
                              - background: rgba(0,0,0,0)
                              - box-shadow: none
                              - margin-left: 3px
                              - border: none
                            name:
                              - font-size: 15px
                              - font-weight: bold
                              - color: dimgray
                              - justify-self: start
                      connect:
                        card:
                          type: custom:button-card
                          entity: sensor.serenitynet_connect_count
                          show_name: false
                          show_state: true
                          state_display: |
                            [[[
                              var usedSpace = parseFloat(states['sensor.serenitynet_connect_count'].state);
                              usedSpace = Math.round(usedSpace);  // 四舍五入取 0 位小数
                              return usedSpace + "  / 65535";
                            ]]]
                          styles:
                            card:
                              - padding: 5px
                              - border-radius: 5px
                              - height: 21px
                              - width: 230px
                              - border: none
                              - background: |
                                  [[[
                                          var usedSpace = parseFloat(states['sensor.serenitynet_connect_count'].state);
                                          usedSpace = Math.round(usedSpace);  // 四舍五入取 0 位小数
                                          var percentage = Math.min(100, (usedSpace / 65535) * 100);
                                          var color;
                                          if (percentage <= 5) {
                                            color = 'rgb(76,176,80)'; // 0-5% 绿色
                                          } else if (percentage > 5 && percentage <= 50) {
                                            color = 'orange'; // 5-50% 黄色
                                          } else {
                                            color = 'OrangeRed'; // >50% 红色
                                          }
                                          return `linear-gradient(to right, ${color} ${percentage}%, FloralWhite ${percentage}%)`;
