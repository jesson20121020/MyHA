                  - grid-template-areas: |

                      "pool1"
                  - grid-template-rows: 45px
              custom_fields:
                pool1:
                  card:
                    type: custom:button-card
                    entity: sensor.synology_nas_volume_1_used_space
                    name: 储存池 • Synology
                    show_entity_picture: true
                    entity_picture: |
                      [[[
                        var health = states['sensor.synology_nas_volume_1_status'].state;
                        if(health === "normal"){
                            return `/local/icon/磁盘健康.png`;
                          } else if (status === "degrade"){
                            return `/local/icon/磁盘降级.png`;
                          } else if (status === "attention"){
                            return `/local/icon/磁盘警告.png`; 
                          } else {
                            return `/local/icon/磁盘损毁.png`;
                          }
                      ]]]
                          
                    show_state: false
                    styles:
                      card:
                        - box-shadow: none
                        - background: rgba(0,0,0,0)
                        - border: none
                      grid:
                        - grid-template-areas: |
                            "i status n"
                            "i line line"
                            "i rom rom"
                        - grid-template-columns: 1.1fr 3fr 3fr
                        - grid-template-rows: 15px 8px 18px
                      icon:
                        - height: 31px
                        - width: 33px
                      name:
                        - margin-top: "-3px"
                        - justify-self: start
                        - font-size: 14px
                        - font-weight: bold
                        - margin-left: 8px
                        - color: dimgray
                      state:
                        - justify-self: start
                    custom_fields:
                      status:
                        card:
                          type: custom:button-card
                          styles:
                            card:
                              - margin-left: 0px
                              - padding: 5px
                              - border-radius: 5px
                              - background: rgba(0,0,0,0)
                              - box-shadow: none
                              - border: none
                            grid:
                              - grid-template-areas: |
                                  "raid line temp"
                              - grid-template-columns: 70px 3px 85px
                          custom_fields:
                            raid:
                              card:
                                type: custom:button-card
                                show_name: false
                                show_state: true
                                state_display: |
                                  [[[
                                    var health = states['sensor.synology_nas_volume_1_status'].state;
                                    if(health === "normal"){
                                        health = "健康";
                                      } else if (status === "degrade"){
                                        health = "降级";
                                      } else if (status === "attention"){
                                        health = "警告"; 
                                      } else {
                                        health = "损毁";
                                      }
                                    return `SHR • ` + health;
                                  ]]]
                                styles:
                                  card:
                                    - height: 21px
                                    - padding: 5px
                                    - border-radius: 5px
                                    - border: none
                                    - background: |
                                        [[[
                                           var health = states['sensor.synology_nas_volume_1_status'].state;
                                           if(health === "normal"){
                                               return `rgb(76,176,80)`;
                                             } else if (status === "degrade"){
                                               return `Tomato`;
                                             } else if (status === "attention"){
                                               return `Orange`; 
                                             } else {
                                               return `Red`;
                                             }
                                         ]]]
                                  name:
                                    - font-size: 13px
                                    - color: white
                                  state:
                                    - font-size: 12px
                                    - color: white
                            temp:
                              card:
                                type: custom:button-card
                                show_name: false
                                show_state: true
                                state_display: |
                                  [[[
                                    var temp = states['sensor.synology_nas_volume_1_average_disk_temp'].state;
                                    return `均温 `+temp+ `°C`;
                                  ]]]
                                styles:
                                  card:
                                    - height: 21px
                                    - padding: 5px
                                    - border-radius: 5px
                                    - border: none
                                    - background: |
                                        [[[
                                           var temp = states['sensor.synology_nas_volume_1_average_disk_temp'].state;
                                           if(temp < 40){
                                               return `rgb(76,176,80)`;
                                             } else if (temp < 45){
                                               return `Orange`;
                                             } else {
                                               return `Tomato`; 
                                             }
                                         ]]]
                                  name:
                                    - font-size: 13px
                                    - color: white
                                  state:
                                    - font-size: 12px
                                    - color: white
                      rom:
                        card:
                          type: custom:button-card
                          show_state: true
                          state_display: |
                            [[[
                              var usedSpace = parseFloat(states['sensor.synology_nas_volume_1_used_space'].state);
                              usedSpace = Math.round(usedSpace);  // 四舍五入取 0 位小数
                              return usedSpace + " TB / 4TB";
                            ]]]
                          styles:
                            card:
                              - padding: 5px
                              - border-radius: 5px
                              - margin-left: 5px
                              - height: 21px
                              - width: 293px
                              - border: none
                              - background: |
                                  [[[
                                          var usedSpace = parseFloat(states['sensor.synology_nas_volume_1_used_space'].state);
                                          usedSpace = Math.round(usedSpace);  // 四舍五入取 0 位小数
                                          var percentage = Math.min(100, (usedSpace / 4) * 100);
                                          var color;
                                          if (percentage <= 50) {
                                            color = 'rgb(76,176,80)'; // 0-50% 绿色
                                          } else if (percentage > 50 && percentage <= 80) {
                                            color = 'orange'; // 50-80% 黄色
                                          } else {
                                            color = 'OrangeRed'; // >80% 红色
                                          }
                                          return `linear-gradient(to right, ${color} ${percentage}%, FloralWhite ${percentage}%)`;
                                  ]]]
                            state:
                              - color: DarkSlateGray
                              - font-size: 14px
                              - justify-self: center
        attributes:
          label: NAS
