                              - border: none
                            state:
                              - font-size: 13px
                              - color: white
                              - justify-self: center
                              - margin-top: "-4px"
                ipv6:
                  card:
                    type: custom:button-card
                    styles:
                      card:
                        - margin-left: "-10px"
                        - margin-top: "-3px"
                        - padding: 5px
                        - border-radius: 5px
                        - box-shadow: none
                        - background: rgba(0,0,0,0)
                        - border: none
                      grid:
                        - grid-template-areas: |
                            "type ip" 
                        - grid-template-columns: 50px auto
                    custom_fields:
                      type:
                        card:
                          type: custom:button-card
                          name: IPV6
                          styles:
                            card:
                              - height: 21px
                              - width: 100px
                              - padding: 5px
                              - border-radius: 5px
                              - background: rgba(0,0,0,0)
                              - box-shadow: none
                              - margin-left: 3px
                              - border: none
                            name:
                              - font-size: 15px
                              - font-weight: bold
                              - color: dimgray
                              - justify-self: start
                      ip:
                        card:
                          type: custom:button-card
                          entity: sensor.serenitynet_wan6_ip
                          show_name: false
                          show_state: true
                          state_display: |
                            [[[
                                return `公网IP • `+states['sensor.serenitynet_wan6_ip'].state;
                            ]]]
                          styles:
                            card:
                              - height: 21px
                              - padding: 5px
                              - margin-left: "-2px"
                              - border-radius: 5px
                              - background: rgb(76,176,80)
                              - border: none
                            state:
                              - font-size: 13px
                              - color: white
                              - justify-self: center
                              - margin-top: "-4px"
        attributes:
          label: iStoreOS
      - card:
          type: vertical-stack
          cards:
            - type: custom:bubble-card
              card_type: empty-column
              card_layout: large-2-rows
            - type: custom:button-card
              name: Synology
              show_entity_picture: true
              entity_picture: /local/icon/NAS1.png
              entity: binary_sensor.synology_nas_security_status
              show_state: true
              state_display: |
                [[[
                  const boot_time_str = states['sensor.system_monitor_last_boot'].state;
                  if (boot_time_str === 'unknown' || boot_time_str === 'unavailable') {
                    return "运行时间：未知";
                  }

                  // 转换为日期对象
                  const boot_time = new Date(boot_time_str);
                  const now = new Date();

                  // 计算差值（毫秒）
                  const diff_ms = now - boot_time;

                  // 计算天、小时、分钟
                  const days = Math.floor(diff_ms / (1000 * 60 * 60 * 24));
                  const hours = Math.floor((diff_ms % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                  const minutes = Math.floor((diff_ms % (1000 * 60 * 60)) / (1000 * 60));

                  return `运行时间:${days}天${hours}小时${minutes}分钟`;
                ]]]
              styles:
                card:
                  - height: 90px
                  - background: rgba(0,0,0,0)
                  - box-shadow: none
                  - border: none
                grid:
                  - grid-template-areas: |
                      "i n shutdown"
                      "i s reboot"
                      "i s2 no"
                  - grid-template-columns: 2.5fr 7fr 1.5fr
                  - grid-template-rows: 30px 10px 30px
                icon:
                  - height: 72px
                  - width: 77px
                  - justify-self: start
                  - margin-left: "-15px"
                name:
                  - justify-self: start
                  - font-size: 20px
                  - color: DimGray
                  - margin-left: "-4px"
                state:
                  - justify-self: start
                  - margin-left: "-4px"
                  - color: DimGray
                  - font-size: 15px
              custom_fields:
                shutdown:
                  card:
                    type: custom:button-card
                    show_state: false
                    show_name: false
                    icon: mdi:power
                    tap_action:
                      action: navigate
                      navigation_path: "#nas_shutdown"
                    styles:
                      card:
                        - height: 30px
                        - background: red
                        - box-shadow: none
                        - margin-left: "-10px"
                        - border: none
                        - margin-top: 0px
                      grid:
                        - grid-template-areas: |
                            "i"
                      icon:
