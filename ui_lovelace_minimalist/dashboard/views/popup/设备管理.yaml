                          show_name: false
                          show_state: true
                          state_display: Wan 2.5Gb/s
                          styles:
                            card:
                              - height: 21px
                              - padding: 5px
                              - margin-left: "-2px"
                              - border-radius: 5px
                              - background: rgb(76,176,80)
                              - border: none
                            state:
                              - font-size: 13px
                              - color: white
                              - justify-self: center
                              - margin-top: 0px
                status:
                  card:
                    type: custom:button-card
                    styles:
                      card:
                        - margin-left: "-10px"
                        - margin-top: "-3px"
                        - padding: 5px
                        - border-radius: 5px
                        - box-shadow: none
                        - background: rgba(0,0,0,0)
                        - border: none
                      grid:
                        - grid-template-areas: |
                            "type speed" 
                        - grid-template-columns: 50px 240px
                    custom_fields:
                      type:
                        card:
                          type: custom:button-card
                          name: 流量
                          styles:
                            card:
                              - height: 21px
                              - width: 100px
                              - padding: 5px
                              - border-radius: 5px
                              - background: rgba(0,0,0,0)
                              - box-shadow: none
                              - margin-left: 3px
                              - border: none
                            name:
                              - font-size: 15px
                              - font-weight: bold
                              - color: dimgray
                              - justify-self: start
                      speed:
                        card:
                          type: custom:button-card
                          styles:
                            card:
                              - padding: 5px
                              - border-radius: 5px
                              - background: rgba(0,0,0,0)
                              - box-shadow: none
                              - margin-left: "-6px"
                              - border: none
                            grid:
                              - grid-template-areas: |
                                  "up line down"
                              - grid-template-columns: 1fr 5px 1fr
                          custom_fields:
                            up:
                              card:
                                type: custom:button-card
                                entity: sensor.openwrt_router_upload_speed
                                show_name: false
                                show_state: true
                                state_display: |
                                  [[[
                                    const upload = parseFloat(states['sensor.openwrt_router_upload_speed']?.state);
                                    if (isNaN(upload)) {
                                      return '上传 • 无数据';
                                    }
                                    return `上传 • ${upload.toFixed(2)} MB/S`;
                                  ]]]
                                styles:
                                  card:
