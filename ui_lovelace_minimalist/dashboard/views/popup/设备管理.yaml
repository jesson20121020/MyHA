type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#servers"
    show_header: false
    bg_color: rgb(255.255.255)
    bg_blur: "0"
    bg_opacity: "80"
    button_type: name
    card_layout: large
    backdrop_blur: "0"
    hide_backdrop: false
    width_desktop: 80%
    shadow_opacity: "0"
    margin: 7px
    margin_top_mobile: 0px
    margin_top_desktop: "-15vh"
    styles: |-
      .bubble-pop-up {
          height: 80vh !important;

      }  
  - type: custom:tabbed-card
    options: {}
    tabs:
      - card:
          type: vertical-stack
          cards:
            - type: custom:bubble-card
              card_type: empty-column
              card_layout: large-2-rows
            - type: custom:button-card
              name: iStoreOS
              show_entity_picture: true
              entity_picture: /local/icon/openwrt.svg
              entity: sensor.bei_kong_j4125_istoreos_uptime
              show_state: true
              state_display: |
                [[[ 
                  // 直接读取传感器状态
                  var uptime_seconds = states['sensor.bei_kong_j4125_istoreos_uptime'].state;
                  return "运行时间: " + uptime_seconds;
                ]]]
              styles:
                card:
                  - height: 90px
                  - background: rgba(0,0,0,0)
                  - box-shadow: none
                  - border: none
                grid:
                  - grid-template-areas: |
                      "i n shutdown"
                      "i s s"
                      "i s2 no"
                  - grid-template-columns: 2.5fr 7fr 1.5fr
                  - grid-template-rows: 30px 10px 30px
                icon:
                  - height: 75px
                  - width: 75px
                  - justify-self: start
                  - margin-left: "-15px"
                name:
                  - justify-self: start
                  - font-size: 20px
                  - color: DimGray
                  - margin-left: "-4px"
                state:
                  - justify-self: start
                  - margin-left: "-4px"
                  - color: DimGray
                  - font-size: 15px
              custom_fields:
                s2:
                  card:
                    type: custom:button-card
                    show_state: true
                    state_display: |
                      [[[
                        var status = states[`binary_sensor.bei_kong_j4125_istoreos_uptime`].state;
                        if (status === "on"){
                          status = "已联网";
                        } else {
                          status = "断线中";
                        }
                        return `系统状态：` + status
                      ]]] 
                    styles:
                      card:
                        - height: 20px
                        - background: rgba(0,0,0,0)
                        - box-shadow: none
                        - margin-left: "-9px"
                        - border: none
                      state:
                        - justify-self: start
                        - margin-left: 5px
                        - color: DimGray
                        - font-size: 16px
            - type: custom:bubble-card
              card_type: empty-column
              card_layout: large-2-rows
            - type: custom:button-card
              show_entity_picture: true
              entity_picture: /local/icon/CPU.png
              styles:
                card:
                  - padding: 5px
                  - border-radius: 15px
                  - box-shadow: none
                  - background: rgba(255,255,255,0)
                  - border: none
                grid:
                  - grid-template-areas: |
                      "i cpu"
                      "i M"
                  - grid-template-rows: 25px 25px
                  - grid-template-columns: 55px auto
                icon:
                  - height: 37px
                  - width: 37px
                  - margin-left: "-3px"
              custom_fields:
                cpu:
                  card:
                    type: custom:button-card
                    styles:
                      card:
                        - margin-left: "-10px"
                        - margin-top: "-3px"
                        - padding: 5px
                        - border-radius: 5px
                        - box-shadow: none
                        - background: rgba(0,0,0,0)
                        - border: none
                      grid:
                        - grid-template-areas: |
                            "type line2 usage" 
                        - grid-template-columns: 45px 3px auto
                    custom_fields:
                      type:
                        card:
                          type: custom:button-card
                          name: CPU
                          styles:
                            card:
                              - height: 21px
                              - width: 45px
                              - padding: 5px
                              - border-radius: 5px
                              - background: rgba(0,0,0,0)
                              - box-shadow: none
                              - border: none
                            name:
                              - font-size: 15px
                              - font-weight: bold
                              - color: dimgray
                              - justify-self: center
                      usage:
                        card:
                          type: custom:button-card
                          entity: sensor.system_monitor_processor_use
                          show_name: false
                          show_state: true
                          state_display: |
                            [[[
                              var usage = parseFloat(states['sensor.system_monitor_processor_use'].state); 
                              return usage + `%`
                            ]]]
                          styles:
                            card:
                              - padding: 5px
                              - border-radius: 5px
                              - height: 21px
                              - width: 230px
                              - border: none
                              - background: |
                                  [[[
                                          var percentage = parseFloat(states['sensor.system_monitor_processor_use'].state); 
                                          var color;
                                          if (percentage <= 30) {
                                            color = 'rgb(76,176,80)'; // 0-50% 绿色
                                          } else if (percentage > 30 && percentage <= 70) {
                                            color = 'orange'; // 50-80% 黄色
                                          } else {
                                            color = 'OrangeRed'; // >80% 红色
                                          }
                                          return `linear-gradient(to right, ${color} ${percentage}%, FloralWhite ${percentage}%)`;
                                  ]]]
                            state:
                              - color: DarkSlateGray
                              - font-size: 14px
                              - justify-self: center
                              - margin-top: "-3px"
                M:
                  card:
                    type: custom:button-card
                    styles:
                      card:
                        - margin-left: "-10px"
                        - margin-top: "-3px"
                        - padding: 5px
                        - border-radius: 5px
                        - box-shadow: none
                        - background: rgba(0,0,0,0)
                        - border: none
                      grid:
                        - grid-template-areas: |
                            "type line2 usage" 
                        - grid-template-columns: 45px 3px auto
                    custom_fields:
                      type:
                        card:
                          type: custom:button-card
                          name: 内存
                          styles:
                            card:
                              - height: 21px
                              - width: 45px
                              - padding: 5px
                              - border-radius: 5px
                              - background: rgba(0,0,0,0)
                              - box-shadow: none
                              - border: none
                            name:
                              - font-size: 15px
                              - font-weight: bold
                              - color: dimgray
                              - justify-self: center
                      usage:
                        card:
                          type: custom:button-card
                          entity: sensor.serenitynet_memory
                          show_name: false
                          show_state: true
                          state_display: |
                            [[[
                              var usage = parseFloat(states['sensor.serenitynet_memory'].state); 
                              return usage + `%`
                            ]]]
                          styles:
                            card:
                              - padding: 5px
                              - border-radius: 5px
                              - height: 21px
                              - border: none
                              - width: 230px
                              - background: |
                                  [[[
                                          var percentage = parseFloat(states['sensor.serenitynet_memory'].state); 
                                          var color;
                                          if (percentage <= 30) {
                                            color = 'rgb(76,176,80)'; // 0-50% 绿色
                                          } else if (percentage > 30 && percentage <= 70) {
                                            color = 'orange'; // 50-80% 黄色
                                          } else {
                                            color = 'OrangeRed'; // >80% 红色
                                          }
                                          return `linear-gradient(to right, ${color} ${percentage}%, FloralWhite ${percentage}%)`;
                                  ]]]
                            state:
                              - color: DarkSlateGray
                              - font-size: 14px
                              - justify-self: center
                              - margin-top: "-3px"
