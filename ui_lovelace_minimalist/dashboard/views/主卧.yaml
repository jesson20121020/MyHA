title: "主卧"
path: "主卧"
type: custom:grid-layout
layout:
  margin: -0.5vh 0vh 0vh
  grid-template-columns: auto
  grid-template-rows: 6vh 94vh
  grid-template-areas: |
    "header"
    "main"
cards:
  - type: custom:button-card # HEADER
    view_layout:
      grid-area: header
    template: card_layout_header
    variables:
      view_name: "主卧"
      back_path: "/ui-lovelace-minimalist/home"
  - type: custom:layout-card # MAIN
    view_layout:
      grid-area: main
    layout_type: custom:vertical-layout
    layout:
      height: 100vh
      margin: 0vh 0vh 0vh
      padding: 0vh 0.4vh
    cards:
      - type: horizontal-stack
        cards: 
        # 显示主卧当前打开的灯的数量
        - type: 'custom:button-card'
          template: 
            - chip_light_counter
          variables:
            ulm_custom_chip_light_couter_entity:
              - switch.switch_c208_switch_2
              - switch.switch_c208_switch_1
              - switch.switch_181c_switch_1
              - switch.switch_181c_switch_2
              - light.yeelink_light3_d886_light

    # 灯光卡片
      - type: 'custom:button-card'
        template: card_title
        name: Lights

      - type: horizontal-stack
        cards:
        - type: "custom:button-card"
          template: card_state_light
          entity: switch.switch_c208_switch_2
          variables:
            ulm_card_light_icon: mdi:lightbulb
            ulm_card_light_name: 床头灯
            ulm_custom_popup:
              entity: light.zhu_wo_chuang_tou_deng
        - type: "custom:button-card"
          template: card_state_light
          entity: switch.switch_c208_switch_1
          variables:
            ulm_card_light_name: 吸顶灯
            ulm_custom_popup:
              entity: light.zhu_wo_xi_ding_deng
      - type: horizontal-stack
        cards:
        - type: "custom:button-card"
          template: card_state_light
          entity: switch.switch_181c_switch_1
          variables:
            ulm_card_light_name: 衣帽间灯
            #  ulm_card_tap_action: "more-info"
        - type: "custom:button-card"
          template: card_state_light
          entity: switch.switch_181c_switch_2
          variables:
            ulm_card_light_name: 床尾灯
            ulm_custom_popup:
              entity: light.zhu_wo_chuang_wei_deng
      - type: "custom:button-card"
        template: card_state_light
        entity: light.yeelink_light3_d886_light
        variables:
          ulm_card_light_name: 飘窗灯
          ulm_custom_popup:
            entity: light.yeelink_light3_d886_light

      - type: 'custom:button-card'
        template: card_title
        name: Fan And AirCondition

      - type: "custom:button-card"
        template: card_fan
        entity: fan.dmaker_cn_547855962_p28_s_2_fan
        variables:
          ulm_card_fan_enable_slider: true
          ulm_card_fan_color: "blue"
          ulm_card_fan_force_background_color: false
            
            
            