- id: '1768281131653'
  alias: 在家->晚安
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.zhu_wo_kai_deng_shu_liang
    below: 1
  - trigger: numeric_state
    entity_id:
    - sensor.ci_wo_kai_deng_shu_liang
    below: 1
  - trigger: time
    at: '22:35:00'
  conditions:
  - condition: and
    conditions:
    - condition: time
      after: '22:30:00'
    - condition: numeric_state
      entity_id: sensor.zhu_wo_kai_deng_shu_liang
      below: 1
    - condition: numeric_state
      entity_id: sensor.ci_wo_kai_deng_shu_liang
      below: 1
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.chang_jing_mo_shi_xuan_ze
      state:
      - 出门模式
  actions:
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.chang_jing_mo_shi_xuan_ze
    data:
      option: 晚安模式
  mode: single
