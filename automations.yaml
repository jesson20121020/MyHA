- id: '1718518334725'
  alias: 小米电视每日使用时长限制
  description: ''
  triggers:
  - entity_id:
    - sensor.jin_ri_dian_shi_zai_xian_shi_chang
    above: input_number.xiao_mi_dian_shi_mei_ri_shi_yong_shi_chang_shang_xian
    trigger: numeric_state
  - entity_id:
    - device_tracker.c8_28_32_34_f9_c7
    from:
    to: home
    trigger: state
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: input_boolean.xiao_mi_dian_shi_shi_chang_xian_zhi_kai_guan
      state: 'on'
    - condition: numeric_state
      entity_id: sensor.jin_ri_dian_shi_zai_xian_shi_chang
      above: input_number.xiao_mi_dian_shi_mei_ri_shi_yong_shi_chang_shang_xian
    - condition: state
      entity_id: device_tracker.c8_28_32_34_f9_c7
      state: home
    - condition: template
      value_template: '{{as_timestamp(now()) - as_timestamp(state_attr(''automation.xin_jian_zi_dong_hua'',''last_triggered''))
        > 300}}'
  actions:
  - device_id: a0ad402ab514b5161c817d3a0c981ef7
    domain: text
    entity_id: be7c34e6b25c1c43b3ec12ff54ba451a
    type: set_value
    value: 小木耳，今日电视使用时长已超上限，十秒后即将自动关闭电视
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - device_id: 85d3ec6226d82be9b40dd0bc25a1c6a4
    domain: select
    entity_id: 0b92916f408f40e24711bcd7a6b071cd
    type: select_option
    option: power
  mode: single
- id: '1718520261178'
  alias: 连续观看电视限制
  description: ''
  triggers:
  - entity_id:
    - sensor.dian_shi_lian_xu_guan_kan_shi_chang
    above: 25
    trigger: numeric_state
  - entity_id:
    - device_tracker.c8_28_32_34_f9_c7
    from:
    to: home
    trigger: state
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: device_tracker.c8_28_32_34_f9_c7
      state: home
    - condition: state
      entity_id: input_boolean.xiao_mi_dian_shi_shi_chang_xian_zhi_kai_guan
      state: 'on'
    - condition: numeric_state
      entity_id: sensor.dian_shi_lian_xu_guan_kan_shi_chang
      above: 25
    - condition: template
      value_template: '

        {{as_timestamp(now()) - as_timestamp(state_attr(''automation.lian_xu_guan_kan_dian_shi_xian_zhi'',''last_triggered''))
        > 300}}'
  actions:
  - device_id: a0ad402ab514b5161c817d3a0c981ef7
    domain: text
    entity_id: be7c34e6b25c1c43b3ec12ff54ba451a
    type: set_value
    value: 小木耳，你已连续看电视超30分钟，十秒后即将自动关闭电视
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - device_id: 85d3ec6226d82be9b40dd0bc25a1c6a4
    domain: select
    entity_id: 0b92916f408f40e24711bcd7a6b071cd
    type: select_option
    option: power
  mode: single
- id: '1734690433738'
  alias: 门口有人自动通知手机
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - camera.madv_miowlv2_fe51_video_doorbell
    attribute: motion_video_time
  conditions: []
  actions:
  - action: notify.mobile_app_iphone_86
    metadata: {}
    data:
      message: 有人在门口逗留
      title: 注意⚠️
      data:
        url: '{{state_attr(''camera.madv_miowlv2_fe51_video_doorbell'',''stream_address'')}}'
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - action: mqtt.publish
    metadata: {}
    data:
      evaluate_payload: false
      qos: '2'
      retain: false
      topic: ha/mijia/doorbell/state_changed
  mode: single
